[package]
name = "skillhub"
version = "0.2.0"
edition = "2024"
description = "Manage agent skills across the projects on your machine."
publish = false

[features]
# Headless runs (`--snap`, `--tree`, `--script`) in release builds; debug builds always take them.
tooling = ["rune/tooling"]

[dependencies]
# Rune is pre-release: one `dev` rev for it, its kit and every patch below.
rune = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a", default-features = false, features = [
    "accessibility",
    "dbus",
    "embedded-fonts",
    "metal-backend",
    "native-file-dialog",
    "svg",
] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a", features = ["markdown"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"
yaml-rust2 = "0.10"

# Cargo doesn't inherit a dependency's patches: these are Rune's own, at the same rev.
[patch.crates-io]
winit = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
parley_engine = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
wgpu-hal = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
accesskit_windows = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }
accesskit_macos = { git = "https://github.com/anomalyco/rune", rev = "78efd4a7876b5478dd72033ce6fd2b2f13ab9f9a" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
codegen-units = 16
strip = true
